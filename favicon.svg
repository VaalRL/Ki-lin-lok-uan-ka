<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a130e" />
      <stop offset="50%" stop-color="#2a1e16" />
      <stop offset="100%" stop-color="#1a130e" />
    </linearGradient>
    <linearGradient id="giraffeOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffa834" />
      <stop offset="50%" stop-color="#ff8800" />
      <stop offset="100%" stop-color="#e65c00" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8800" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00e676" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="8" />

  <!-- Background Soft Aura -->
  <circle cx="256" cy="270" r="140" fill="#ff8800" opacity="0.14" filter="url(#glow)" />

  <!-- Headphone Arch (Behind Giraffe) -->
  <path d="M 145 270 A 115 115 0 0 1 367 270" fill="none" stroke="url(#cyanGrad)" stroke-width="26" stroke-linecap="round" />

  <!-- Giraffe Neck -->
  <path d="M 210 330 L 210 440 L 302 440 L 302 330 Z" fill="url(#giraffeOrange)" />
  <!-- Neck Spots -->
  <circle cx="236" cy="380" r="14" fill="#a04000" opacity="0.85" />
  <circle cx="276" cy="415" r="12" fill="#a04000" opacity="0.85" />
  <circle cx="270" cy="355" r="10" fill="#a04000" opacity="0.85" />

  <!-- Giraffe Ossicones (Horns) -->
  <path d="M 226 210 L 226 145" stroke="#cc5200" stroke-width="12" stroke-linecap="round" />
  <circle cx="226" cy="138" r="16" fill="#8f3900" />
  <path d="M 286 210 L 286 145" stroke="#cc5200" stroke-width="12" stroke-linecap="round" />
  <circle cx="286" cy="138" r="16" fill="#8f3900" />

  <!-- Giraffe Ears -->
  <path d="M 190 230 C 150 215 155 190 185 210 Z" fill="#ff8800" stroke="#cc5200" stroke-width="4" />
  <path d="M 322 230 C 362 215 357 190 327 210 Z" fill="#ff8800" stroke="#cc5200" stroke-width="4" />

  <!-- Giraffe Head Main -->
  <ellipse cx="256" cy="255" rx="72" ry="78" fill="url(#giraffeOrange)" />

  <!-- Giraffe Head Spot -->
  <circle cx="288" cy="232" r="10" fill="#a04000" opacity="0.8" />

  <!-- Giraffe Muzzle / Snout -->
  <ellipse cx="256" cy="305" rx="54" ry="40" fill="#ffe5d0" />
  <!-- Nostrils -->
  <circle cx="242" cy="298" r="5" fill="#662200" />
  <circle cx="270" cy="298" r="5" fill="#662200" />
  <!-- Smile -->
  <path d="M 246 322 Q 256 332 266 322" fill="none" stroke="#662200" stroke-width="4" stroke-linecap="round" />

  <!-- Eyes -->
  <ellipse cx="228" cy="245" rx="9" ry="12" fill="#1a130e" />
  <circle cx="225" cy="241" r="3.5" fill="#ffffff" />
  <ellipse cx="284" cy="245" rx="9" ry="12" fill="#1a130e" />
  <circle cx="281" cy="241" r="3.5" fill="#ffffff" />

  <!-- Headphone Ear Pads (Front Layer) -->
  <rect x="130" y="240" width="36" height="74" rx="18" fill="url(#cyanGrad)" stroke="#e0f2fe" stroke-width="4" />
  <rect x="346" y="240" width="36" height="74" rx="18" fill="url(#cyanGrad)" stroke="#e0f2fe" stroke-width="4" />
  <!-- Headphone Pivot Details -->
  <circle cx="148" cy="277" r="7" fill="#1a130e" />
  <circle cx="364" cy="277" r="7" fill="#1a130e" />

  <!-- Audio Waves / Music Beats -->
  <path d="M 98 258 Q 90 277 98 296" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.8" />
  <path d="M 80 248 Q 68 277 80 306" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" opacity="0.5" />
  
  <path d="M 414 258 Q 422 277 414 296" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.8" />
  <path d="M 432 248 Q 444 277 432 306" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" opacity="0.5" />

  <!-- Small Glowing Play Badge on Right Bottom -->
  <circle cx="395" cy="395" r="42" fill="#00e676" stroke="#1a130e" stroke-width="7" />
  <polygon points="387,377 413,395 387,413" fill="#ffffff" />
</svg>